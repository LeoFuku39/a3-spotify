@if(resources) {
<div [id]="carouselId" class="carousel slide carousel-fade">
  <div class="carousel-inner">
    @for(r of resources; track r.id; let first=$first) {
      <app-carousel-card class="carousel-item" [resource]="r" [class.active]="first"></app-carousel-card>
    }
  </div>
  <a class="carousel-control-prev" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </a>
  <a class="carousel-control-next" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </a>
</div>
}
